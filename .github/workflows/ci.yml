name: CI — Build, Typecheck, Lint, Link Check, Smoke & Lighthouse Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CI_BUILD: "true"
  NEXT_PUBLIC_APP_URL: https://mexautomation.in
  NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY: ci-not-a-real-turnstile-site-key
  CLOUDFLARE_TURNSTILE_SECRET_KEY: ci-not-a-real-turnstile-secret-key
  DATABASE_URL: postgresql://ci-user:ci-not-a-real-password@localhost:5432/ci_db
  RESEND_API_KEY: ci-not-a-real-resend-key
  UPSTASH_REDIS_REST_URL: https://ci-not-a-real-redis.upstash.io
  UPSTASH_REDIS_REST_TOKEN: ci-not-a-real-redis-token
  SALES_EMAIL: sales@mexautomation.in
  CAREERS_EMAIL: careers@mexautomation.in
  EMAIL_FROM: "MEX Automation <contact@mexautomation.in>"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript strict check
        run: pnpm tsc --noEmit

      - name: ESLint check
        run: pnpm lint

      - name: Production build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke & axe accessibility tests
        run: pnpm exec playwright test

      - name: Linkinator broken-link check
        run: |
          pnpm start &
          SERVER_PID=$!
          npx wait-on http://localhost:3000 -t 30000 || sleep 5
          pnpm check:links
          kill $SERVER_PID || true

      - name: Lighthouse CI audit
        run: pnpm exec lhci autorun
